name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The build validates the database target but never connects; these are placeholders.
      DATABASE_URL: postgresql://postgres:build@db.zfbiyyhedhqdgrxxajrj.supabase.co:5432/postgres
      DIRECT_URL: postgresql://postgres:build@db.zfbiyyhedhqdgrxxajrj.supabase.co:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: https://zfbiyyhedhqdgrxxajrj.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Starts its own postgres:16-alpine container (Docker is available on ubuntu-latest) and
      # runs every test except the live-model ones. No paid model is called.
      - run: npm run test:postgres
        env:
          DATABASE_URL: ""
          DIRECT_URL: ""
