name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The build validates the database target but never connects; these are placeholders.
      DATABASE_URL: postgresql://postgres:build@db.zfbiyyhedhqdgrxxajrj.supabase.co:5432/postgres
      DIRECT_URL: postgresql://postgres:build@db.zfbiyyhedhqdgrxxajrj.supabase.co:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: https://zfbiyyhedhqdgrxxajrj.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a test reads the accepted V03 prompt from git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Starts its own postgres:16-alpine container (Docker is available on ubuntu-latest) and
      # runs every test except the live-model ones. No paid model is called.
      - name: Tests
        run: set -o pipefail; npm run test:postgres 2>&1 | tee test.log
        env:
          DATABASE_URL: ""
          DIRECT_URL: ""
      # Failed tests become annotations on the run page (readable without downloading logs).
      - name: Report failed tests
        if: failure()
        run: |
          grep -n -E "^(not ok|# (tests|pass|fail))" test.log | head -40 | while read -r line; do echo "::error title=test::${line}"; done
          grep -n -E "^\s+error: " -A3 test.log | head -80 | sed 's/^/::notice title=detail::/' | head -60
