<!-- Supabase → Authentication → Email Templates → "Reset password". Subject: Сброс пароля в Vocal -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1d1a24">
  <h2 style="margin:0 0 16px">Сброс пароля</h2>
  <p>Мы получили запрос на смену пароля для вашего аккаунта в Vocal. Нажмите кнопку, чтобы задать новый пароль.</p>
  <p style="margin:24px 0">
    <a href="{{ .ConfirmationURL }}" style="background:#6c5bd4;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:10px;display:inline-block">Задать новый пароль</a>
  </p>
  <p style="font-size:13px;color:#6b6676">Если кнопка не работает, откройте ссылку: <br>{{ .ConfirmationURL }}</p>
  <p style="font-size:13px;color:#6b6676">Если вы не запрашивали смену пароля, ничего не делайте: пароль останется прежним.</p>
</div>
