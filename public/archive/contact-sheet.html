<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P01.6-0 archive contact sheet</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #0b0714;
        color: #f5f3ff;
        font-family: Georgia, serif;
      }
      h1 {
        font-weight: 400;
        font-size: 1.4rem;
      }
      .desk {
        height: 180px;
        margin: 16px 0 28px;
        background:
          linear-gradient(180deg, rgba(11, 7, 20, 0.35), rgba(11, 7, 20, 0.12)),
          url("./desk/desk.webp"),
          url("./desk/desk.svg");
        background-size: cover;
        border: 1px solid rgba(196, 181, 253, 0.18);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
      }
      .card {
        aspect-ratio: 3 / 4;
        background-size: cover;
        background-position: center;
        position: relative;
      }
      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(11, 7, 20, 0.18), rgba(11, 7, 20, 0.46));
      }
      figcaption {
        margin-top: 8px;
        font-size: 0.8rem;
        color: #9e94ad;
      }
    </style>
  </head>
  <body>
    <h1>P01.6-0 local archive assets</h1>
    <div class="desk" role="img" aria-label="Desk background"></div>
    <div class="grid">
      <figure>
        <div class="card" style="background-image:url('./cards/01.webp'),url('./cards/01.svg')"></div>
        <figcaption>01</figcaption>
      </figure>
      <figure>
        <div class="card" style="background-image:url('./cards/02.webp'),url('./cards/02.svg')"></div>
        <figcaption>02</figcaption>
      </figure>
      <figure>
        <div class="card" style="background-image:url('./cards/03.webp'),url('./cards/03.svg')"></div>
        <figcaption>03</figcaption>
      </figure>
      <figure>
        <div class="card" style="background-image:url('./cards/04.webp'),url('./cards/04.svg')"></div>
        <figcaption>04</figcaption>
      </figure>
      <figure>
        <div class="card" style="background-image:url('./cards/05.webp'),url('./cards/05.svg')"></div>
        <figcaption>05</figcaption>
      </figure>
      <figure>
        <div class="card" style="background-image:url('./cards/06.webp'),url('./cards/06.svg')"></div>
        <figcaption>06</figcaption>
      </figure>
      <figure>
        <div class="card" style="background-image:url('./cards/07.webp'),url('./cards/07.svg')"></div>
        <figcaption>07</figcaption>
      </figure>
      <figure>
        <div class="card" style="background-image:url('./cards/08.webp'),url('./cards/08.svg')"></div>
        <figcaption>08</figcaption>
      </figure>
      <figure>
        <div class="card" style="background-image:url('./cards/09.webp'),url('./cards/09.svg')"></div>
        <figcaption>09</figcaption>
      </figure>
      <figure>
        <div class="card" style="background-image:url('./cards/10.webp'),url('./cards/10.svg')"></div>
        <figcaption>10</figcaption>
      </figure>
    </div>
  </body>
</html>
